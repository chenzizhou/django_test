<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册页面</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <style>
        body {
            background-color: #f8f9fa;
        }
        .auth-container {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .auth-form {
            margin-bottom: 1rem;
        }
        .auth-form h2 {
            text-align: center;
            margin-bottom: 2rem;
            color: #0d6efd;
        }
        .form-check-label {
            font-size: 0.9rem;
        }
        .auth-button {
            width: 100%;
            margin-top: 1rem;
        }
        .auth-link {
            text-align: center;
            margin-top: 2rem;
            color: #6c757d;
        }
        .auth-link a {
            color: #0d6efd;
            text-decoration: none;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">My Website</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="#login">登录</a>
                <a class="nav-link" href="#register">注册</a>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="container">
        <div class="auth-container">
            <!-- 登录表单 -->
            <form class="auth-form" id="loginForm">
                <h2>登录</h2>
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码">
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">记住我</label>
                </div>
                <button type="submit" class="btn btn-primary auth-button">登录</button>
            </form>

            <!-- 注册表单 -->
            <form class="auth-form" id="registerForm">
                <h2>注册</h2>
                <div class="mb-3">
                    <label for="newUsername" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="newUsername" name="newUsername" placeholder="请输入用户名">
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">密码</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="请输入密码">
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">确认密码</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码">
                </div>
                <button type="submit" class="btn btn-success auth-button">注册</button>
            </form>

            <!-- 链接 -->
            <div class="auth-link">
                <p>忘记密码？ <a href="#">点击这里重置密码</a></p>
                <p>需要帮助？ <a href="#">联系客服</a></p>
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
